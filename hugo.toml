baseURL = "https://anybyte.github.io/"
title = "Max Lyaskovskiy"
theme = "PaperMod"
languageCode = "en-us"
defaultContentLanguage = "en"
enableRobotsTXT = true
buildDrafts = false

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  description = "Senior backend engineer in Moscow. Python and Django for ~7 years. Creator of safeway.app and artway.space."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  homeInfoParams = false
  disableHLJS = true

  [params.profileMode]
    enabled = true
    title = "Max Lyaskovskiy"
    subtitle = "Senior backend engineer in Moscow. Python and Django for ~7 years.<br>Creator of safeway.app and artway.space."
    imageUrl = "/images/avatar.jpg"
    imageTitle = "Max Lyaskovskiy"
    imageWidth = 200
    imageHeight = 200
    buttons = [
      { name = "Projects", url = "/projects/" },
      { name = "Resume (PDF)", url = "/resume.pdf" },
    ]

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/AnyByte"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/anybyte/"

[[params.socialIcons]]
  name = "telegram"
  url = "https://t.me/AnyByte"

[[params.socialIcons]]
  name = "email"
  url = "mailto:maxavatar007@gmail.com"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    name = "Experience"
    url = "/experience/"
    weight = 3
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 4
  [[menu.main]]
    name = "Resume"
    url = "/resume.pdf"
    weight = 5
